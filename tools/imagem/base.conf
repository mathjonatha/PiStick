# Imagem base do construtor (tools/imagem/montar-imagem.sh): Raspberry Pi OS Lite de 64 bits (Debian 13
# "trixie"). Lido como `sh` (variáveis simples). O SHA-256 é o publicado no site oficial, junto do arquivo
# (<BASE_URL>.sha256); o construtor confere o arquivo baixado antes de usá-lo.
BASE_VERSAO="2026-10-06"
BASE_ARQUIVO="2026-10-06-raspios-trixie-arm64-lite.img.xz"
BASE_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-10-06/2026-10-06-raspios-trixie-arm64-lite.img.xz"
BASE_SHA256="483db18a48da399b5b7022ffae9a07bc6d99daab30e593aedac09b69ff422843"

# Quanto a partição raiz cresce (MiB) para caber o que o instalador põe (pacotes apt do PiStick). O
# construtor falha se sobrar menos de 200 MiB livres; ajuste aqui se a lista de pacotes crescer.
CRESCER_MIB="700"

# A base oficial traz o compilador (build-essential, gcc). Remover (1) arrasta os linux-headers e faz o apt
# trocar o kernel da base por um mais novo; por isso o padrão é 0 (deixa como veio, sem mexer no kernel).
REMOVER_COMPILADOR="0"
