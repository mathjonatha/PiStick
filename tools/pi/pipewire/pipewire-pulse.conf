# pipewire-pulse do PiStick (marco 7): o servidor PulseAudio que mpv, navegadores e o Waydroid encontram em
# $XDG_RUNTIME_DIR/pulse/native. Instalado em /etc/pistick/pipewire/pipewire-pulse.conf; usado pelo psd:
#   pipewire-pulse -c /etc/pistick/pipewire/pipewire-pulse.conf

context.properties = { }

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]

stream.properties = { }

pulse.properties = {
    server.address = [ "unix:native" ]
}
