# PipeWire do PiStick (marco 7). Instalado em /etc/pistick/pipewire/pipewire.conf e usado pelo psd:
#   pipewire -c /etc/pistick/pipewire/pipewire.conf
# Sem hardware de som: o único dispositivo é o sorvedouro virtual "pistick" (padrão), e o som que os apps
# tocam nele sai pelo soquete de PCM cru em 127.0.0.1:4711 (módulo protocol-simple), de onde o psd o lê.
# Medições e escolhas em docs/16-marco-7-audio.md, "Resultado da prova".

context.properties = {
    link.max-buffers = 16
    core.daemon = true
    core.name = pipewire-0
    # Tudo em 48 kHz, ciclos de 10 ms: o fluxo do fio é PCM de 48 kHz em pacotes de 480 quadros.
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 480
    default.clock.min-quantum = 64
    default.clock.max-quantum = 2048
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 rt.prio = 88 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
    # PCM cru S16LE estéreo de 48 kHz do monitor do sorvedouro. Só aceita endereço tcp: (não há soquete Unix),
    # então fica restrito ao laço local; a mesma porta está em ps_server::audio::PIPEWIRE_PCM_ADDR.
    { name = libpipewire-module-protocol-simple
        args = {
            server.address = [ "tcp:127.0.0.1:4711" ]
            capture = true
            stream.capture.sink = true
            target.object = "pistick"
            audio.rate = 48000
            audio.format = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            node.latency = 480/48000
            node.name = pistick-saida
        }
    }
    # A fonte virtual do microfone (marco 7B): o lado de captura do loopback é um sorvedouro (pistick-mic-entrada,
    # onde o soquete 4712 escreve) e o lado de reprodução é a fonte pistick-mic, onde os apps do Pi gravam. Uma
    # fonte "Audio/Source/Virtual" de null-audio-sink não serve: o WirePlumber não liga a ela o fluxo do soquete.
    { name = libpipewire-module-loopback
        args = {
            node.description = "Microfone do PiStick"
            audio.rate = 48000
            audio.position = [ FL FR ]
            capture.props = {
                node.name = pistick-mic-entrada
                media.class = Audio/Sink
                node.passive = true
                priority.session = 100
            }
            playback.props = {
                node.name = pistick-mic
                media.class = Audio/Source
                node.passive = true
                priority.session = 3000
            }
        }
    }
    # Marco 7B: o microfone do computador. O psd escreve PCM cru S16LE estéreo de 48 kHz neste soquete (só enquanto
    # algum app do Pi grava da fonte pistick-mic) e o PipeWire o entrega à fonte virtual do loopback acima.
    { name = libpipewire-module-protocol-simple
        args = {
            server.address = [ "tcp:127.0.0.1:4712" ]
            playback = true
            playback.props = { target.object = "pistick-mic-entrada" }
            audio.rate = 48000
            audio.format = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            node.latency = 480/48000
            node.name = pistick-mic-escrita
        }
    }
]

context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = Dummy-Driver
            node.group = pipewire.dummy
            priority.driver = 200000
        }
    }
    # O sorvedouro virtual: nada toca no Pi (nem fone, nem HDMI). Como é o único sorvedouro, o WirePlumber
    # (perfil policy, sem monitor ALSA) o escolhe como padrão; a prioridade alta o mantém assim com o sorvedouro
    # do microfone (pistick-mic-entrada) existindo.
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = pistick
            node.description = "PiStick"
            priority.session = 2000
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            audio.rate = 48000
            object.linger = true
            node.pause-on-idle = false
        }
    }
]
