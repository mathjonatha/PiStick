[package]
name = "ps-secure"
description = "Canal cifrado e pareamento do PiStick: Noise XX (25519, ChaChaPoly, SHA256), enquadramento e chaves"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ps-transport = { path = "../ps-transport" }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
getrandom = "0.3.4"
zeroize = "1.8"
