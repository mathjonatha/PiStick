[package]
name = "ps-update"
description = "Atualizações assinadas do PiStick: manifesto de arquivos e assinatura Ed25519 (verificador e ferramentas de publicação)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ps_update"

[[bin]]
name = "ps-update"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10.9", default-features = false }
getrandom = "0.3.4"
zeroize = "1.8"
