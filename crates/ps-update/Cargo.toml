[package]
name = "ps-update"
description = "Atualizações assinadas do PiStick: manifesto de arquivos e assinatura Ed25519 (verificador e ferramentas de publicação)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ps_update"

[[bin]]
name = "ps-update"
path = "src/main.rs"

[dependencies]
# Assinatura é primitiva criptográfica: não se escreve do zero (docs/21, docs/25). Só `ed25519-dalek` 2.x, sem as
# características padrão (sem `rand_core` nem `serde`); a chave nova vem do `getrandom`.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10.9", default-features = false }
getrandom = "0.3.4"
zeroize = "1.8"
